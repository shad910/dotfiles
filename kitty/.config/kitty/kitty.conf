# ==============================================================================
# 1. FONT CONFIGURATION
# ==============================================================================
# JetBrainsMono Propo Nerd Font
font_family      JetBrainsMonoNL Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# ==============================================================================
# 2. APPEARANCE & BATTERY-FRIENDLY OPACITY / BLUR
# ==============================================================================
# Mild opacity (0.95 = 95% visible, slightly transparent)
background_opacity 0.95

# Set background blur to 1 (mild) to avoid high GPU power consumption
background_blur 1

# Disable dynamic redraws to save laptop battery
dynamic_background_opacity no

# ==============================================================================
# 3. BEHAVIOR (DISABLE BELL SOUND & CONFIRMATION PROMPT)
# ==============================================================================
# Disable annoying terminal bell sound
enable_audio_bell no

# Close terminal immediately without asking twice
confirm_os_window_close 0

# ==============================================================================
# 4. CUSTOM KEYBINDINGS
# ==============================================================================
# Unmap default mappings to prevent conflicts
clear_all_shortcuts no

# Ctrl+A: Select All
map ctrl+a select_all

# Ctrl+C: Copy selected text (or send interrupt if no text is selected)
# Use 'copy_or_interrupt' so you can still stop running scripts with Ctrl+C
map ctrl+c copy_or_interrupt

# Ctrl+V: Paste from clipboard
map ctrl+v paste_from_clipboard

# Ctrl+Shift+C: Send SIGINT / interrupt signal (what Ctrl+C previously did)
map ctrl+shift+c send_text all \x03

# Ctrl+Shift+Arrow Keys: Text selection extension / word-by-word selection
map ctrl+shift+left  send_text all \x1b[1;6D
map ctrl+shift+right send_text all \x1b[1;6C
map ctrl+shift+up    send_text all \x1b[1;6A
map ctrl+shift+down  send_text all \x1b[1;6B

